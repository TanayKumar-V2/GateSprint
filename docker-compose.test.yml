name: gate-mentor-test

# Isolated integration-test profile. Never touches dev volumes/ports.
services:
  testdb:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: gate_test
      POSTGRES_PASSWORD: gate_test
      POSTGRES_DB: gate_mentor_test
    ports:
      - "5433:5432"
    volumes:
      - pgtestdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gate_test -d gate_mentor_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  testredis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgtestdata:
